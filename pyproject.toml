[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subvlm"
version = "1.0.0"
description = "Subliminal learning in vision-language models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["subvlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
